$('state').textContent=`阶段：${phase}；施动者帧 ${ai+1}/${actorClip.frames.length}，原始时间 ${Math.round(Math.min(attackTime,actorClip.total_duration_raw))}。${phase==='await'?'已到候选事件1；请手动确认。':''}`}

function tick(now){let delta=last?Math.min(now-last,100):0;last=now;let raw=delta*(+$('rate').value||1000)/1000;idleTime+=raw;if(phase==='attack'){attackTime+=raw;if(attackTime>=eventPoint){attackTime=eventPoint;phase='await';$('signal').disabled=false;log('达到候选事件1：第 '+(sample.event1_candidate.frame+1)+' 帧，原始偏移 '+eventPoint+'；等待确认')}}else if(phase==='hit'){attackTime+=raw;hurtTime+=raw;effectTime+=raw}draw().catch(e=>$('state').textContent=e.message);requestAnimationFrame(tick)}
