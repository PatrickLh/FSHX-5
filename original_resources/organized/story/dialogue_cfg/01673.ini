			CoordinateSystem = Screen		//座標系統 World Screen  世界座標系統 或螢幕座標系統
			RenderQueue = Foreground		//圖層 Background Main Foreground Menu Mouse 配合iRenderQueueDelta產生圖層ID 需注意圖層太多 將會影響效能
			iRenderQueueDelta = 0		//傳入 9 到 -10 的值  改變圖層的ID 值越大 物件會在越上層(晚畫出)
			rgbaColor = 255 , 255 , 255 , 255		//提供color 操作
			bUseBillboarding = FALSE		//是否使用告示版
			BillboardingLockAxis = None		//使用告示版時 是否鎖定某一軸向 傳入 X , Y , Z , None 預設為None
			fApproachCameraDistance = 0.0		//要靠近攝影機的距離
			fRanderSortDalta = 0.0		//改變繪圖排序
			Effect = <EffectName>		//參考effect說明 不需使用請刪除此行

			[RenderState]
			{

				[SetRenderState]
				{
					打開Alpha混合 = 27 1
					Alpha混合來源 = 19 5
					Alpha混合目標 = 20 6
				}

				[SetTextureStageState]
				{
				}

				[SetSamplerState]
				{
				}

				[SetTexture]
				{
				}
			}

			[Matrix]
			{
				fScaleX = 1.0f		//縮放 預設值 1.0f (倍率)
				fScaleY = 1.0f
				fScaleZ = 1.0f
				fRotYaw = 0.0f		//選轉 預設值 0.0f (角度)
				fRotPitch = 0.0f
				fRotRoll = 0.0f
				fPosX = 0.0f		//縮位 預設值 0.0f (公尺)
				fPosY = 0.0f
				fPosZ = -50.0f
			}
		}
	}

