	[Run]
	{

		[顯示背景]
		{
			dwConditionOfStart = 0
			Type = SetShow
			Object = BLACK		//物件的id 這個節點所要控制的繪圖物件
			bShow = TRUE
		}

		[顯示背景]
		{
			dwConditionOfStart = 0
			Type = SetShow
			Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
			bShow = TRUE

			[設定物件顏色]
			{
				dwConditionOfStart = 0
				Type = SetColor
				Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
				fDelayTime = 0.0		//條件成立後所要延遲的
				fWorkTime = 0.0		//預設要工作的時間
				dwColor = 0x00FFFFFF

				[設定物件顏色]
				{
					dwConditionOfStart = 0
					Type = SetColor
					Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
					fDelayTime = 0.0		//條件成立後所要延遲的
					fWorkTime = 1.5		//預設要工作的時間
					dwColor = 0xFFFFFFFF

					[停10秒]
					{
						dwConditionOfStart = 0		//啟動條件    0 父節點end ,1 事件1 ,2 事件2 ,3.....
						fDelayTime = 0.0		//條件成立後所要延遲的
						fWorkTime = 10.0		//預設要工作的時間
						Object = Script		//預留用 目前更改無用
						Type = Nothing		//節點的型態 資料的類型
						BeginMessage = 0		//這個工作啟動時 會發出訊息給其他腳本
						EndMessage = 0		//這個工作結束時 會發出訊息給其他腳本

						[設定物件顏色]
						{
							dwConditionOfStart = 0
							Type = SetColor
							Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
							fDelayTime = 0.0		//條件成立後所要延遲的
							fWorkTime = 0.0		//預設要工作的時間
							dwColor = 0xFFFFFFFF

							[設定物件顏色]
							{
								dwConditionOfStart = 0
								Type = SetColor
								Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
								fDelayTime = 0.0		//條件成立後所要延遲的
								fWorkTime = 0.0		//預設要工作的時間
								dwColor = 0x00FFFFFF

								[呼叫劇本]
								{
									dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
									Type = LoadScriptFile		//節點的型態 資料的類型
									ScriptName = ReturnBegin.txt		//要呼叫的劇本名稱

									[Delay]
									{
										dwConditionOfStart = 0		//啟動條件    0 父節點end ,1 事件1 ,2 事件2 ,3.....
										fDelayTime = 0.0		//條件成立後所要延遲的
										fWorkTime = 0.1		//預設要工作的時間
										Object = Script		//預留用 目前更改無用
										Type = Nothing		//節點的型態 資料的類型
										BeginMessage = 0		//這個工作啟動時 會發出訊息給其他腳本
										EndMessage = 0		//這個工作結束時 會發出訊息給其他腳本

										[關閉背景]
										{
											dwConditionOfStart = 0
											Type = SetShow
											Object = TheEND		//物件的id 這個節點所要控制的繪圖物件
											bShow = FLASE
										}
									}
								}
							}
						}
					}
				}
			}
		}
	}
