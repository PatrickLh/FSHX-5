<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>attack00 事件与素材组合实验</title>
<style>body{font:15px system-ui;background:#17202b;color:#e7eef6;margin:22px}h1{font-size:23px}a{color:#a9d2ff}button,select,input{font:inherit;margin:5px;padding:7px}button:disabled{opacity:.4}p{line-height:1.7}.note{color:#ffda9c}canvas{width:100%;max-width:1000px;border:1px solid #576b7d;background:#263542}pre{white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:#202d3b;padding:14px}#events{max-height:180px;overflow:auto}label{display:inline-block}h2{font-size:18px}</style>
<h1>attack00：事件与素材组合实验</h1><p><a href="index.html">资源目录</a> · <a href="animation_viewer.html">独立动画</a></p>
<p class="note">用于核验素材关联，并非原引擎回放。动作组 0001/0002 仅为演示绑定；画面采用固定二维位置。到达原始标记 1 时会等待手动确认，随后按“命中、目标存活”分支试播。</p>
<button id="start">1 开始攻击片段</button><button id="signal" disabled>2 按示例命中分支发送事件1</button><button id="reset">重置</button><br>
<label>试播：每秒原始时间单位 <input id="rate" type="number" value="1000" min="100" max="10000"></label><label><input id="key" type="checkbox" checked>预览抠除纯绿</label><label><input id="sound" type="checkbox">播放帧音效</label><label><input id="add" type="checkbox" checked>试用特效加亮合成</label>
<p id="state">待机</p><canvas id="scene" width="1000" height="580"></canvas>
<h2>事件记录</h2><ol id="events"></ol><h2>来源与未验证项</h2><pre id="evidence"></pre>
<script>
const sample=__SAMPLE_JSON__;
const $=id=>document.getElementById(id),ctx=$('scene').getContext('2d'),loaded=new Map(),processed=new Map();
let phase='idle',attackTime=0,hurtTime=0,effectTime=0,idleTime=0,last=0,generation=0,played=new Set();
const eventPoint=sample.event1_candidate.offset_raw;
$('evidence').textContent=JSON.stringify({script:sample.source_script_path,role_bindings:sample.demo_role_bindings,markers:sample.attack_markers,nodes:sample.evidence_nodes.map(n=>({line:n.source_line,path:n.section_path,attributes:n.attributes})),manual_branches:sample.manual_branches,preview_policies:sample.preview_policies},null,2);
function log(text){let li=document.createElement('li');li.textContent=text;$('events').append(li);$('events').scrollTop=$('events').scrollHeight}
function image(id){if(loaded.has(id))return loaded.get(id);let p=new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(sample.images[id].url));im.src=sample.images[id].url});loaded.set(id,p);return p}
async function material(id,key,color){let k=id+key+color.slice(2);if(processed.has(k))return processed.get(k);let im=await image(id);let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let g=c.getContext('2d');g.drawImage(im,0,0);try{let pixels=g.getImageData(0,0,c.width,c.height),rgb=[2,4,6].map(i=>parseInt(color.slice(i,i+2),16)/255);for(let i=0;i<pixels.data.length;i+=4){if(key&&pixels.data[i]===0&&pixels.data[i+1]===255&&pixels.data[i+2]===0)pixels.data[i+3]=0;for(let j=0;j<3;j++)pixels.data[i+j]*=rgb[j]}g.putImageData(pixels,0,0)}catch(e){/* file:// may restrict pixel reads; source image remains visible */}processed.set(k,c);return c}
function frame(clip,time,loop=false){if(loop&&clip.total_duration_raw>0)time%=clip.total_duration_raw;let sum=0;for(let i=0;i<clip.frames.length;i++){sum+=Math.max(1,clip.frames[i].duration_raw);if(time<sum)return [clip.frames[i],i]}return [clip.frames[clip.frames.length-1],clip.frames.length-1]}
function soundFor(clip,idx){if(!$('sound').checked)return;let token=clip.id+':'+idx;if(played.has(token))return;played.add(token);for(let id of clip.frames[idx].sound_ids||[]){let asset=sample.sounds[id];if(asset)new Audio(asset.url).play().catch(()=>log('浏览器阻止音频播放：'+id))}}
async function draw(){let gen=++generation,actorClip=sample.animations[phase==='idle'?'active_idle':'active_attack'],targetClip=sample.animations[phase==='hit'?'target_hurt':'target_idle'];let [af,ai]=frame(actorClip,phase==='idle'?idleTime:attackTime,phase==='idle'),[tf,ti]=frame(targetClip,phase==='hit'?hurtTime:idleTime,phase!=='hit');let a=sample.preview_layout.active,b=sample.preview_layout.target,e=sample.preview_layout.effect;let clips=[[actorClip,af,ai,a.x,a.y,a.scale],[targetClip,tf,ti,b.x,b.y,b.scale]];
if(phase==='hit'&&effectTime<sample.animations.hit_effect.total_duration_raw){let [f,i]=frame(sample.animations.hit_effect,effectTime);clips.push([sample.animations.hit_effect,f,i,e.x,e.y,e.scale])}
let layers=[];for(let[c,f,i,x,y,s]of clips){if(phase!=='idle'&&phase!=='await')soundFor(c,i);for(let l of f.layers)if(l.image_ids.length)layers.push([l,await material(l.image_ids[0],$('key').checked,l.color_hex),x,y,s,c===sample.animations.hit_effect])}if(gen!==generation)return;
ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,1000,580);ctx.fillStyle='#263542';ctx.fillRect(0,0,1000,580);ctx.strokeStyle='#647180';ctx.beginPath();ctx.moveTo(50,475);ctx.lineTo(950,475);ctx.stroke();ctx.fillStyle='#dce6f1';ctx.font='18px system-ui';ctx.fillText('施动者：动作组 0001',a.x-110,535);ctx.fillText('目标：动作组 0002',b.x-110,535);
for(let[l,im,x,y,s,isEffect]of layers){let m=l.matrix_3x3,[tx,ty]=l.translation_xyz,w=l.logical_size?.[0]||im.width,h=l.logical_size?.[1]||im.height;ctx.setTransform(s*m[0],-s*m[1],-s*m[3],s*m[4],x+s*tx,y-s*ty);ctx.globalCompositeOperation=isEffect&&$('add').checked?'lighter':'source-over';ctx.globalAlpha=parseInt(l.color_hex.slice(0,2),16)/255;ctx.drawImage(im,-w/2,-h/2,w,h)}ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
$('state').textContent=`阶段：${phase}；施动者帧 ${ai+1}/${actorClip.frames.length}，原始时间 ${Math.round(Math.min(attackTime,actorClip.total_duration_raw))}。${phase==='await'?'已到候选事件1；请手动确认。':''}`}
$('start').onclick=()=>{phase='attack';attackTime=0;hurtTime=0;effectTime=0;played.clear();$('signal').disabled=true;$('events').textContent='';log('开始 ActivePerson / SetPose Attack（attack00 源码节点）');draw()};
$('signal').onclick=()=>{if(phase!=='await')return;phase='hit';hurtTime=0;effectTime=0;$('signal').disabled=true;log('人工确认：把 ANT 第一标记字段的 1 作为事件1');log('选择 ActionList_Hit：ActivePerson Hit → PassivePerson Hit');log('命中片段 Hit000 = sp/hit000.ant；选择 ResultLive → HurtBelly（04）');draw()};
$('reset').onclick=()=>{phase='idle';attackTime=0;hurtTime=0;effectTime=0;played.clear();$('signal').disabled=true;log('重置为预览待机状态');draw()};$('key').onchange=()=>draw();
function tick(now){let delta=last?Math.min(now-last,100):0;last=now;let raw=delta*(+$('rate').value||1000)/1000;idleTime+=raw;if(phase==='attack'){attackTime+=raw;if(attackTime>=eventPoint){attackTime=eventPoint;phase='await';$('signal').disabled=false;log('达到候选事件1：第 '+(sample.event1_candidate.frame+1)+' 帧，原始偏移 '+eventPoint+'；等待确认')}}else if(phase==='hit'){attackTime+=raw;hurtTime+=raw;effectTime+=raw}draw().catch(e=>$('state').textContent=e.message);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></html>
