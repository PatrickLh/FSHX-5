<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景与模型资源审计</title><style>body{background:#17202b;color:#e7eef6;font:15px system-ui;margin:24px}h1{font-size:24px}a{color:#add6ff}select,input{font:inherit;padding:8px;max-width:100%;margin:6px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #455564;text-align:left;overflow-wrap:anywhere}p{line-height:1.6}.images{display:flex;flex-wrap:wrap;gap:14px}.images a{width:145px;font-size:11px;overflow-wrap:anywhere}.images img{width:145px;height:120px;object-fit:contain;background:#364451}.note{color:#ffda9c}pre{white-space:pre-wrap;word-break:break-all;max-height:380px;overflow:auto}details{background:#202d3b;padding:12px;margin:12px 0}</style>
<h1>场景与模型资源审计</h1><p><a href="index.html">资源目录</a> · <a href="attack_sample.html">攻击组合实验</a></p><p class="note">这是依赖与几何检查页。缩略图是原贴图，不是场景渲染。模型坐标、帧变换与场景参数保持分开；场景拼装、相机、材质效果和 Godot 导入尚未验证。</p>
<label>筛选路径 <input id="filter" type="search"></label><label>场景 <select id="scene"></select></label><h2 id="title"></h2><p id="summary"></p><p><a id="source">打开源配置</a></p><h2>关联模型</h2><table><thead><tr><th>原路径</th><th>Mesh</th><th>顶点</th><th>面</th><th>蒙皮块</th><th>动画集</th></tr></thead><tbody id="models"></tbody></table><h2>关联图片与贴图</h2><div id="images" class="images"></div><details><summary>Earth 槽位与材质引用</summary><pre id="slots"></pre></details><details><summary>光照与雾原始字段</summary><pre id="lighting"></pre></details><details><summary>未匹配依赖</summary><pre id="missing"></pre></details><details><summary>模型局部范围与检查结果</summary><pre id="geometry"></pre></details>
<script>const scenes=__SCENE_DATA__,$=id=>document.getElementById(id);function render(){let r=$('scene').value===''?null:scenes[+$('scene').value];if(!r){$('title').textContent='没有匹配场景';$('summary').textContent='';$('models').replaceChildren();$('images').replaceChildren();$('source').hidden=true;for(let k of ['slots','lighting','missing','geometry'])$(k).textContent='';return;}$('source').hidden=false;$('title').textContent=r.path;$('source').href=r.source_url;$('summary').textContent=`${r.slots.length} 个 Earth 槽位；${r.models.length} 个可达模型；${r.images.length} 张可达图片；${r.missing.length} 行未匹配依赖。`;$('models').replaceChildren();for(let m of r.models){let tr=document.createElement('tr');for(let text of[m.original_path,m.mesh_count,m.vertices,m.faces,m.skin_weight_blocks,m.animation_sets]){let td=document.createElement('td');td.textContent=text;tr.append(td)}$('models').append(tr)}$('images').replaceChildren();for(let im of r.images){let a=document.createElement('a');a.href=im.url;let img=document.createElement('img');img.loading='lazy';img.src=im.url;img.alt=im.path;a.append(img,document.createTextNode(`${im.path} (${im.width}×${im.height})`));$('images').append(a)}for(let key of ['slots','lighting','missing'])$(key).textContent=JSON.stringify(r[key],null,2);$('geometry').textContent=JSON.stringify(r.models,null,2)}function filter(){let needle=$('filter').value.toLowerCase();$('scene').replaceChildren();scenes.forEach((r,i)=>{if(r.path.toLowerCase().includes(needle)){let o=document.createElement('option');o.value=i;o.textContent=r.path;$('scene').append(o)}});render()}$('filter').oninput=filter;$('scene').onchange=render;filter();</script></html>
