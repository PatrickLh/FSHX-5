<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人物与特效动画核验</title>
<style>body{margin:24px;font:15px system-ui;background:#17202b;color:#e7eef6}h1{font-size:24px}a{color:#9ad1ff}select,button,input{font:inherit;margin:4px;padding:6px}label{display:inline-block;margin-right:14px}main{display:grid;grid-template-columns:minmax(400px,800px) 1fr;gap:20px}canvas{width:100%;background:#273441;border:1px solid #678}pre{white-space:pre-wrap;word-break:break-all;background:#202d3b;padding:16px;max-height:550px;overflow:auto}p{line-height:1.7}.note{color:#ffd99b}@media(max-width:900px){main{display:block}}</style>
<h1>人物动作与技能素材预览</h1><p><a href="index.html">图片目录</a> · <a href="animation-analysis.md">核验报告</a></p>
<p class="note">结构核验工具：保留原帧顺序和 XY 矩阵；1000 原始时间单位/秒为试播假设，可调整。Z 投影与原引擎混合规则尚未还原。绿色抠除仅作用于预览，不修改素材。</p>
<select id="choice" aria-label="动画选择"></select><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><br>
<label>帧 <input id="frame" type="range" min="0" value="0"><output id="frameText"></output></label>
<label>每秒原始时间单位 <input id="units" type="number" min="1" max="100000" value="1000"></label>
<label><input id="key" type="checkbox">预览抠除纯绿色</label><label><input id="add" type="checkbox">试用加亮合成</label>
<main><div><canvas id="canvas" width="800" height="620"></canvas><p id="status"></p></div><pre id="details"></pre></main>
<script>
const data=__DATA_JSON__;
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let anim,index=0,playing=true,last=0,elapsed=0,generation=0,cache=new Map(),processed=new Map();
for(const [i,a] of data.animations.entries()){let o=document.createElement('option');o.value=i;o.textContent=a.original_path+(a.pose?.name?' · '+a.pose.name:'');$('choice').append(o)}
function texture(id){if(cache.has(id))return cache.get(id);let entry=data.images[id];let p=new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(entry.url));im.src=entry.url});cache.set(id,p);return p}
async function drawable(id,key,color){let rgb=color.slice(2),token=id+key+rgb;if(processed.has(token))return processed.get(token);let im=await texture(id);if(!key&&rgb==='ffffff')return im;const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);try{let p=g.getImageData(0,0,c.width,c.height),r=parseInt(rgb.slice(0,2),16)/255,gr=parseInt(rgb.slice(2,4),16)/255,b=parseInt(rgb.slice(4,6),16)/255;for(let i=0;i<p.data.length;i+=4){if(key&&p.data[i]===0&&p.data[i+1]===255&&p.data[i+2]===0)p.data[i+3]=0;p.data[i]*=r;p.data[i+1]*=gr;p.data[i+2]*=b}g.putImageData(p,0,0)}catch(e){$('status').textContent='浏览器限制像素读取；保留原图。通过本地 HTTP 打开可启用像素预览。'}processed.set(token,c);return c}
async function draw(){const gen=++generation,f=anim.frames[index];if(!f)return;let layers=[];for(let l of f.layers){if(l.image_ids.length){let im=await drawable(l.image_ids[0],$('key').checked,l.color_hex);layers.push([l,im])}}if(gen!==generation)return;
ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,800,620);ctx.fillStyle='#273441';ctx.fillRect(0,0,800,620);ctx.strokeStyle='#455667';ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,620);ctx.moveTo(0,310);ctx.lineTo(800,310);ctx.stroke();
let bounds=[Infinity,Infinity,-Infinity,-Infinity];for(let [l,im]of layers){let m=l.matrix_3x3,[tx,ty]=l.translation_xyz;for(let x of[-(l.logical_size?.[0]||im.width)/2,(l.logical_size?.[0]||im.width)/2])for(let y of[-(l.logical_size?.[1]||im.height)/2,(l.logical_size?.[1]||im.height)/2]){let xx=m[0]*x+m[3]*y+tx,yy=m[1]*x+m[4]*y+ty;bounds=[Math.min(bounds[0],xx),Math.min(bounds[1],yy),Math.max(bounds[2],xx),Math.max(bounds[3],yy)]}}
// Use an animation-wide fixed viewport derived from all texture matrices, avoiding frame-by-frame camera jitter.
let b=anim.preview_bounds||[-100,-100,100,100],s=Math.min(3,700/Math.max(1,b[2]-b[0]),520/Math.max(1,b[3]-b[1])),ox=400-s*(b[0]+b[2])/2,oy=310+s*(b[1]+b[3])/2;
for(let[l,im]of layers){let m=l.matrix_3x3,[tx,ty]=l.translation_xyz;ctx.setTransform(s*m[0],-s*m[1],-s*m[3],s*m[4],ox+s*tx,oy-s*ty);ctx.globalCompositeOperation=$('add').checked?'lighter':'source-over';ctx.globalAlpha=parseInt(l.color_hex.slice(0,2),16)/255;let w=l.logical_size?.[0]||im.width,h=l.logical_size?.[1]||im.height;ctx.drawImage(im,-w/2,-h/2,w,h)}ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
$('frame').value=index;$('frameText').value=`${index+1}/${anim.frames.length}`;$('status').textContent=`${f.layer_count} 图层；原始帧时间 ${f.duration_raw}；缺失 ${f.layers.filter(l=>!l.image_ids.length).length} 图层`;
$('details').textContent=JSON.stringify({path:anim.original_path,pose:anim.pose,frame:index,source_line:f.line,duration_raw:f.duration_raw,sound:f.sound_reference,layers:f.layers},null,2)}
function select(){anim=data.animations[+$('choice').value];index=0;elapsed=0;$('frame').max=anim.frames.length-1;let b=[Infinity,Infinity,-Infinity,-Infinity];for(let f of anim.frames)for(let l of f.layers){let im=data.images[l.image_ids[0]];if(!im)continue;let m=l.matrix_3x3,[tx,ty]=l.translation_xyz;for(let x of[-(l.logical_size?.[0]||im.width)/2,(l.logical_size?.[0]||im.width)/2])for(let y of[-(l.logical_size?.[1]||im.height)/2,(l.logical_size?.[1]||im.height)/2]){let xx=m[0]*x+m[3]*y+tx,yy=m[1]*x+m[4]*y+ty;b=[Math.min(b[0],xx),Math.min(b[1],yy),Math.max(b[2],xx),Math.max(b[3],yy)]}}anim.preview_bounds=Number.isFinite(b[0])?b:[-100,-100,100,100];draw().catch(e=>$('status').textContent=e.message)}
$('choice').onchange=select;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
function step(n){playing=false;$('play').textContent='播放';index=(index+n+anim.frames.length)%anim.frames.length;elapsed=0;draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('frame').oninput=()=>{index=+$('frame').value;step(0)};$('key').onchange=()=>draw();$('add').onchange=()=>draw();
function tick(now){let delta=last?now-last:0;last=now;if(playing&&anim){elapsed+=delta*(+$('units').value||1000)/1000;let changed=false,guard=0;while(elapsed>=Math.max(1,anim.frames[index].duration_raw)&&guard++<500){elapsed-=Math.max(1,anim.frames[index].duration_raw);index=(index+1)%anim.frames.length;changed=true}if(changed)draw().catch(e=>$('status').textContent=e.message)}requestAnimationFrame(tick)}
select();requestAnimationFrame(tick);
</script></html>
