																	Target = L		//控制的目標
																	dwExpression = 1		//人物表情
																}

																[對話]
																{
																	dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
																	Type = Talk		//節點的型態 資料的類型
																	Target = A		//控制的目標
																	dwPage = 0		//對話框的哪一頁
																	dwPersonIdx = 1		//對話人物檔中 人物標號
																	dwTalk = 85		//要秀對話檔中的哪一行
																}
															}
														}
													}
												}
											}
										}
									}
								}
							}
						}
					}
				}
			}
		}

		[Sound]
		{
			Type = Nothing		//之後加音效

			[SetSound]
			{
				Type = Nothing

				[載入劇本指令]
				{
					dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
					Type = LoadScriptString		//節點的型態 資料的類型
					Script = PlaySound( "script\\S123.wav" )		//要執行劇本

					[Delay]
					{
						dwConditionOfStart = 0		//啟動條件    0 父節點end ,1 事件1 ,2 事件2 ,3.....
						fDelayTime = 0.0		//條件成立後所要延遲的
						fWorkTime = 2.1		//預設要工作的時間
						Object = Script		//預留用 目前更改無用
						Type = Nothing		//節點的型態 資料的類型
						BeginMessage = 0		//這個工作啟動時 會發出訊息給其他腳本
						EndMessage = 0		//這個工作結束時 會發出訊息給其他腳本
					}
				}
			}
		}

		[Call FocusR]
		{
			dwConditionOfStart = 0		//右方大頭焦點（右大頭亮，左大頭暗）
			Type = SendMessage
			Target = This		//人物節點的名稱 注意 需加 [ ] , 傳入 This 或 與本身腳本名稱相符 表示只發給自己
			Action = [FocusR]		//物件的腳本名稱

			[TalkR]
			{
				Type = Nothing		//右大頭對話

				[設定對話人物]
				{
					dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
					Type = SetFace		//節點的型態 資料的類型
					Target = R		//控制的目標 （右邊的對話大頭）
					dwPersonIdx = 4		//對話人物檔中 人物標號 （右邊的對話大頭）
				}

				[設定人物表情]
				{
					dwCondition = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
					Type = SetExpression		//節點的型態 資料的類型
					Target = R		//控制的目標
					dwExpression = 2		//人物表情
				}

				[對話]
				{
					dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
					Type = Talk		//節點的型態 資料的類型
					Target = A		//控制的目標
					dwPage = 0		//對話框的哪一頁
					dwPersonIdx = 4		//對話人物檔中 人物標號
					dwTalk = 87		//要秀對話檔中的哪一行

					[Call FocusL]
					{
						dwConditionOfStart = 0		//左方大頭焦點（左大頭亮，右大頭暗）
						Type = SendMessage
						Target = This		//人物節點的名稱 注意 需加 [ ] , 傳入 This 或 與本身腳本名稱相符 表示只發給自己
						Action = [FocusL]		//物件的腳本名稱

						[TalkL]
						{
							Type = Nothing		//左大頭對話

							[設定人物表情]
							{
								dwCondition = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
								Type = SetExpression		//節點的型態 資料的類型
								Target = L		//控制的目標
								dwExpression = 1		//人物表情
							}

							[對話]
							{
								dwConditionOfStart = 0		//啟動條件   0 父節點end ,1 事件1 ,2 事件2 ,3.....
								Type = Talk		//節點的型態 資料的類型
								Target = A		//控制的目標
								dwPage = 0		//對話框的哪一頁
								dwPersonIdx = 1		//對話人物檔中 人物標號
								dwTalk = 88		//要秀對話檔中的哪一行
							}
						}
					}
				}
			}
		}

		[CloseTalkA]
		{
			dwConditionOfStart = 0		//關閉對話框（下方有框）
